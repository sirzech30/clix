[package]
name = "clix"
version = "0.1.0"
edition = "2024"
description = "Linux auto-clicker with GTK4/libadwaita GUI"
license = "MIT"
authors = ["Sirzech <xenonargon30@gmail.com>"]
repository = "https://github.com/sirzech30/clix"
homepage = "https://github.com/sirzech30/clix"
readme = "README.md"

[[bin]]
name = "clix"
path = "src/main.rs"

[dependencies]
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_4"] }
glib = "0.21"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

nix = { version = "0.29", features = ["poll", "user"] }
libc = "0.2"
thiserror = "2"
dirs = "7"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.deb]
name = "clix"
maintainer = "Sirzech <xenonargon30@gmail.com>"
copyright = "© 2026 Sirzech"
section = "utils"
priority = "optional"

depends = [
    "libgtk-4-1",
    "libadwaita-1-0",
    "libc6",
]

assets = [
    ["target/release/clix", "usr/bin/clix", "755"],
    ["udev/99-clix-uinput.rules", "usr/lib/udev/rules.d/99-clix-uinput.rules", "644"],
    ["udev/clix-uinput.conf", "usr/lib/modules-load.d/clix-uinput.conf", "644"],
    ["systemd/clix.service", "usr/lib/systemd/user/clix.service", "644"],
    ["README.md", "usr/share/doc/clix/README.md", "644"],
    ["LICENSE", "usr/share/doc/clix/LICENSE", "644"],
    ["icons/clix.svg", "usr/share/icons/hicolor/scalable/apps/clix.svg", "644"],
    ["desktop/clix.desktop", "usr/share/applications/clix.desktop", "644"],
]

[package.metadata.generate-rpm]
name = "clix"
summary = "Linux auto-clicker with GTK4/libadwaita GUI"
license = "MIT"
group = "Utilities"

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
glib2 = "*"
glibc = "*"

[package.metadata.generate-rpm.build_requires]
gtk4-devel = "*"
libadwaita-devel = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/clix"
dest = "/usr/bin/clix"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "udev/99-clix-uinput.rules"
dest = "/usr/lib/udev/rules.d/99-clix-uinput.rules"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "udev/clix-uinput.conf"
dest = "/usr/lib/modules-load.d/clix-uinput.conf"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "systemd/clix.service"
dest = "/usr/lib/systemd/user/clix.service"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/clix/README.md"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/doc/clix/LICENSE"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "icons/clix.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/clix.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "desktop/clix.desktop"
dest = "/usr/share/applications/clix.desktop"
mode = "644"
