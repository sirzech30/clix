[package]
name = "clix"
version = "0.1.0"
edition = "2024"
description = "Linux auto-clicker with GTK4/libadwaita GUI"
license = "MIT"

[[bin]]
name = "clix"
path = "src/main.rs"

[dependencies]
gtk4 = "0.10"
libadwaita = { version = "0.8", features = ["v1_4"] }
glib = "0.21"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
evdev = "0.12"
nix = { version = "0.29", features = ["poll", "user"] }
libc = "0.2"
thiserror = "2"
dirs = "6"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.deb]
name = "clix"
section = "utils"
priority = "optional"
assets = [
    ["target/release/clix", "usr/bin/clix", "755"],
    ["udev/99-clix-uinput.rules", "usr/lib/udev/rules.d/99-clix-uinput.rules", "644"],
    ["systemd/clix.service", "usr/lib/systemd/user/clix.service", "644"],
    ["README.md", "usr/share/doc/clix/README.md", "644"],
    ["LICENSE", "usr/share/doc/clix/LICENSE", "644"],
]
depends = [
    "libgtk-4-1",
    "libadwaita-1-0",
    "libc6",
]

[package.metadata.generate-rpm]
name = "clix"
version = "0.1.0"
license = "MIT"
summary = "Linux auto-clicker with GTK4/libadwaita GUI"
description = "Linux auto-clicker with GTK4/libadwaita GUI"
url = ""
group = "Utilities"
build_requires = [
    "gtk4-devel",
    "libadwaita-devel",
]
requires = [
    "gtk4",
    "libadwaita",
    "glib2",
    "libc6",
]
assets = [
    { source = "target/release/clix", dest = "/usr/bin/clix", mode = "755" },
    { source = "udev/99-clix-uinput.rules", dest = "/usr/lib/udev/rules.d/99-clix-uinput.rules", mode = "644" },
    { source = "systemd/clix.service", dest = "/usr/lib/systemd/user/clix.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/clix/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/clix/LICENSE", mode = "644" },
]
